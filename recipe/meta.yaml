{% set name = "tsgettoolbox" %}
{% set version = "26.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/tsgettoolbox-{{ version }}.tar.gz
  sha256: 91cbe5b086c59bba91c4fc7a382d5b72a4426de596ef1f251d7ab0c9a6f96865

build:
  entry_points:
    - tsgettoolbox = tsgettoolbox.tsgettoolbox:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - aiodns >=3.5.0
    - async_retriever
    - beautifulsoup4
    - cftime
    - cltoolbox >=4.0.4
    - dateparser
    - deprecated
    - geojson
    - haversine
    - httpretty
    - isodate
    - jinja2
    - lxml
    - matplotlib-base >=3.3.2
    - mechanize
    - numpy
    - openpyxl >=3.0.7
    - odfpy >=1.4.1
    - packaging
    - pandas
    - pint
    - pint-pandas
    - platformdirs
    - pydantic >=2
    - pydap
    - pyogrio
    - pytables >=3.6.1
    - python-dateutil
    - pyxlsb >=1.0.8
    - requests
    - scipy
    - siphon
    - suds-community
    - tabulate
    - typing-extensions
    - xlrd >=2.0.1
    - xlsxwriter

test:
  imports:
    - tsgettoolbox
  commands:
    - pip check
    - tsgettoolbox --help
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Will get time series from different sources on the internet
  home: https://pypi.org/project/tsgettoolbox/
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - timcera
