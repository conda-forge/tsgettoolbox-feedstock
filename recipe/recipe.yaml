schema_version: 1

context:
  name: tsgettoolbox
  version: "27.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 72e0c17048b7d6c646de849e12fa578f3162f944bd3b1af89187eb15b7cb2de8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps
  python:
    entry_points:
      - tsgettoolbox = tsgettoolbox.tsgettoolbox:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80
    - setuptools-scm >=6.2
    - wheel
    - pip

  run:
    - python >=${{ python_min }}
    - beautifulsoup4
    - cftime
    - cltoolbox >=4.0.4
    - dateparser
    - geojson
    - haversine
    - httpretty
    - isodate
    - jinja2
    - lxml
    - matplotlib-base >=3.3.2
    - numpy
    - openpyxl >=3.0.7
    - odfpy >=1.4.1
    - pandas
    - pint
    - pint-pandas
    - platformdirs
    - pydantic >=2
    - pydap
    - pyxlsb >=1.0.8
    - requests
    - scipy
    - siphon
    - tabulate
    - typing-extensions
    - xlrd >=2.0.1
    - xlsxwriter

tests:
  - python:
      imports:
        - tsgettoolbox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - tsgettoolbox --help

about:
  summary: Will get time series from different sources on the internet
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/tsgettoolbox/

extra:
  recipe-maintainers:
    - timcera
