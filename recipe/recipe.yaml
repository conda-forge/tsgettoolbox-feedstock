schema_version: 1

context:
  python_min: 3.10
  version: 27.1.0

package:
  name: tsgettoolbox
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tsgettoolbox/tsgettoolbox-${{ version }}.tar.gz
  sha256: 72e0c17048b7d6c646de849e12fa578f3162f944bd3b1af89187eb15b7cb2de8

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - tsgettoolbox = tsgettoolbox.tsgettoolbox:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=80
    - pip
  run:
    - python >=${{ python_min }}
    - aiodns >3.6.0
    - async_retriever
    - beautifulsoup4
    - cftime
    - cltoolbox >=4.0.4
    - dateparser
    - deprecated
    - geojson
    - haversine
    - httpretty
    - isodate
    - jinja2
    - lxml
    - mechanize
    - numpy
    - openpyxl >=3.0.7
    - odfpy >=1.4.1
    - pandas
    - pint
    - pint-pandas
    - platformdirs
    - pydantic >=2
    - pydap
    - pyxlsb >=1.0.8
    - requests
    - scipy
    - siphon
    - suds-community
    - tabulate
    - typing-extensions
    - xlrd >=2.0.1
    - xlsxwriter

tests:
  - python:
      imports:
        - tsgettoolbox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - tsgettoolbox --help

about:
  summary: Will get time series from different sources on the internet
  license: MIT AND BSD-3-Clause
  license_file:
    - LICENSE.txt
    - src/tsgettoolbox/toolbox_utils/LICENSE.txt
    - src/tsgettoolbox/cdo_api_py/LICENSE.txt
  homepage: https://pypi.org/project/tsgettoolbox/

extra:
  recipe-maintainers:
    - timcera
