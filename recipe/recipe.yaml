schema_version: 1

context:
  name: tsgettoolbox
  version: "26.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 0614103f1e4369bc431373e715be719ed3cbcdae3187f2d61b41e0a498bce202

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps
  python:
    entry_points:
      - tsgettoolbox = tsgettoolbox.tsgettoolbox:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - aiodns >3.6.0
    - async_retriever
    - beautifulsoup4
    - cftime
    - cltoolbox >=4.0.4
    - dateparser
    - deprecated
    - geojson
    - haversine
    - httpretty
    - isodate
    - jinja2
    - lxml
    - matplotlib-base >=3.3.2
    - mechanize
    - numpy
    - openpyxl >=3.0.7
    - odfpy >=1.4.1
    - packaging
    - pandas
    - pint
    - pint-pandas
    - platformdirs
    - pydantic >=2
    - pydap
    - pyogrio
    - pytables >=3.6.1
    - python-dateutil
    - pyxlsb >=1.0.8
    - requests
    - scipy
    - siphon
    - suds-community
    - tabulate
    - typing-extensions
    - xlrd >=2.0.1
    - xlsxwriter

tests:
  - python:
      imports:
        - tsgettoolbox
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - tsgettoolbox --help

about:
  summary: Will get time series from different sources on the internet
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/tsgettoolbox/

extra:
  recipe-maintainers:
    - timcera
